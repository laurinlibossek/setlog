name: Deploy Setlog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: No placeholders go live
        run: |
          if grep -rn --include='*.js' --include='*.html' -F '[EMAIL]' setlog; then
            echo "::error::Fill in CONTACT_EMAIL in setlog/js/core/links.js before deploying."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: setlog
      - id: deployment
        uses: actions/deploy-pages@v4
